# Central report runs at 19:00 UTC and reads today's (UTC) uploads; each run must finish by 18:55 UTC. Last deploys are at 18:00 local.
#
# GitHub Actions — Shopware Playwright suite, one job per shop (same idea as bitbucket-pipelines.yml)
#
# When it runs
#   - Mon–Fri, one smoke run per shop at its own slot (UTC):
#       wurth 17:17 · bg 17:37 · dinoparts 17:57 · mallstreet 18:25 · miniaturemarket 18:43
#     The test step of a scheduled run is cut off at 18:50 UTC so the summary + upload still land before 18:55.
#   - every pull request and push to main → smoke on every shop (NOT uploaded to the central report)
#   - by hand: Actions → Playwright E2E → Run workflow (uploaded — the central report uses the latest run of the day)
#
# Setup (once): Settings → Environments → one environment per shop, named exactly like its profile in projects/:
#   mallstreet, wurth, miniaturemarket, dinoparts, bg
# The repo is PUBLIC: anything that names a shop host or logs in is a secret, never a variable (variables show in logs).
#   Secrets:    BASE_URL (required — a shop without it is skipped), E2E_HEADER_NAME + E2E_HEADER_VALUE,
#               ADMIN_CLIENT_ID + ADMIN_CLIENT_SECRET (or ADMIN_USERNAME + ADMIN_PASSWORD), HTTP_USERNAME + HTTP_PASSWORD,
#               TEST_CUSTOMER_EMAIL + TEST_CUSTOMER_PASSWORD, SW_ACCESS_KEY,
#               NEW_CUSTOMER_PASSWORD (optional — without it every registered test customer gets a random password)
#   Variables:  ALLOW_WRITE_TESTS, CLEANUP_TEST_DATA, WORKERS (1 for shops that answer 429, e.g. Miniature Market),
#               HEADED, EXTRA_BROWSERS, LAYOUT_VIEWPORTS — switches only, nothing sensitive
# Central QA report (repository secrets, shared by all shops): PROFIHOST_HOST, PROFIHOST_USER, PROFIHOST_SSH_KEY,
#   PROFIHOST_KNOWN_HOSTS, PROFIHOST_PORT (optional). Without PROFIHOST_HOST the upload is skipped with a notice.
# ALLOW_WRITE_TESTS / CLEANUP_TEST_DATA are "false" here unless the environment sets them to "true" — read-only by default.
#
# No artifacts (public repo: anyone could download them) and no traces / videos / screenshots in this CI.
# Results: the job summary, the log, and summary.json + results.json on Profihost.

name: Playwright E2E

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # one cron per shop — the plan job maps the cron that fired to its shop (keep both lists in sync)
    - cron: '17 17 * * 1-5' # wurth
    - cron: '37 17 * * 1-5' # bg
    - cron: '57 17 * * 1-5' # dinoparts
    - cron: '25 18 * * 1-5' # mallstreet
    - cron: '43 18 * * 1-5' # miniaturemarket
  workflow_dispatch:
    inputs:
      shop:
        description: 'Shop (all = every shop)'
        type: choice
        options: [all, mallstreet, wurth, miniaturemarket, dinoparts, bg]
        default: all
      mode:
        description: 'smoke = @smoke on chromium (what the scheduled runs do), full = every test'
        type: choice
        options: [smoke, full]
        default: smoke
      grep:
        description: 'Only tests matching (e.g. @checkout or "Product search"); empty = all'
        required: false

permissions:
  contents: read

jobs:
  # which shops, which mode, upload or not — and for scheduled runs how long the tests may take
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shops: ${{ steps.plan.outputs.shops }}
      mode: ${{ steps.plan.outputs.mode }}
      upload: ${{ steps.plan.outputs.upload }}
      test_timeout: ${{ steps.plan.outputs.test_timeout }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          IN_SHOP: ${{ inputs.shop }}
          IN_MODE: ${{ inputs.mode }}
        run: |
          all='["mallstreet","wurth","miniaturemarket","dinoparts","bg"]'
          mode=smoke; upload=false; timeout=25
          case "$EVENT" in
            schedule)
              case "$SCHEDULE" in
                '17 17 * * 1-5') shop=wurth ;;
                '37 17 * * 1-5') shop=bg ;;
                '57 17 * * 1-5') shop=dinoparts ;;
                '25 18 * * 1-5') shop=mallstreet ;;
                '43 18 * * 1-5') shop=miniaturemarket ;;
                *) echo "::error::No shop for cron '$SCHEDULE' — add it to the plan job"; exit 1 ;;
              esac
              shops="[\"$shop\"]"; upload=true
              # tests must stop by 18:50 UTC (summary + upload until 18:55); GitHub sometimes starts schedules late
              left=$(( ( $(date -u -d 'today 18:50' +%s) - $(date -u +%s) ) / 60 ))
              timeout=$(( left < 25 ? left : 25 )); [ "$timeout" -ge 3 ] || timeout=3
              ;;
            workflow_dispatch)
              if [ "$IN_SHOP" = all ]; then shops=$all; else shops="[\"$IN_SHOP\"]"; fi
              mode=${IN_MODE:-smoke}; upload=true
              [ "$mode" = full ] && timeout=110
              ;;
            *) shops=$all ;;
          esac
          {
            echo "shops=$shops"; echo "mode=$mode"; echo "upload=$upload"; echo "test_timeout=$timeout"
          } | tee -a "$GITHUB_OUTPUT"

  e2e:
    needs: plan
    name: ${{ matrix.shop }}
    runs-on: ubuntu-latest
    # keep the tag in sync with @playwright/test in package.json
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    environment: ${{ matrix.shop }}
    timeout-minutes: ${{ needs.plan.outputs.mode == 'full' && 120 || 35 }}
    concurrency:
      group: e2e-${{ matrix.shop }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      # Würth, DinoParts, B&G and Mall Street cloud7 share one staging server → don't hit it with everything at once
      max-parallel: 3
      matrix:
        shop: ${{ fromJSON(needs.plan.outputs.shops) }}
    env:
      CI: 'true'
      HOME: /root
      PROJECT: ${{ matrix.shop }}
      BASE_URL: ${{ secrets.BASE_URL }}
      ALLOW_WRITE_TESTS: ${{ vars.ALLOW_WRITE_TESTS || 'false' }}
      CLEANUP_TEST_DATA: ${{ vars.CLEANUP_TEST_DATA || 'false' }}
      WORKERS: ${{ vars.WORKERS }}
      HEADED: ${{ vars.HEADED }}
      EXTRA_BROWSERS: ${{ vars.EXTRA_BROWSERS }}
      LAYOUT_VIEWPORTS: ${{ vars.LAYOUT_VIEWPORTS }}
      E2E_HEADER_NAME: ${{ secrets.E2E_HEADER_NAME }}
      E2E_HEADER_VALUE: ${{ secrets.E2E_HEADER_VALUE }}
      HTTP_USERNAME: ${{ secrets.HTTP_USERNAME }}
      HTTP_PASSWORD: ${{ secrets.HTTP_PASSWORD }}
      ADMIN_CLIENT_ID: ${{ secrets.ADMIN_CLIENT_ID }}
      ADMIN_CLIENT_SECRET: ${{ secrets.ADMIN_CLIENT_SECRET }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      TEST_CUSTOMER_EMAIL: ${{ secrets.TEST_CUSTOMER_EMAIL }}
      TEST_CUSTOMER_PASSWORD: ${{ secrets.TEST_CUSTOMER_PASSWORD }}
      NEW_CUSTOMER_PASSWORD: ${{ secrets.NEW_CUSTOMER_PASSWORD }}
      SW_ACCESS_KEY: ${{ secrets.SW_ACCESS_KEY }}
      TEST_GREP: ${{ inputs.grep }}
    steps:
      - name: Check the shop's environment is set up
        id: ready
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "::warning title=${PROJECT} skipped::Environment '${PROJECT}' has no BASE_URL secret — add the shop's settings under Settings → Environments → ${PROJECT}."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.ready.outputs.ok == 'true'

      - name: Run tests
        if: steps.ready.outputs.ok == 'true'
        timeout-minutes: ${{ fromJSON(needs.plan.outputs.test_timeout) }}
        run: bash ci/e2e.sh "${{ needs.plan.outputs.mode }}"

      # ---- central QA report ----
      - name: Build QA summary
        if: always() && steps.ready.outputs.ok == 'true'
        env:
          # step-level PROJECT is the report's project slug; the job-level PROJECT (shop profile) is only for the tests
          PROJECT: team-007-shopware-automation
          ENVIRONMENT: ${{ matrix.shop }}
          OWNER: Era Gashi
          RUN_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -d node_modules ] || npm ci
          npx tsx scripts/make-summary.ts
          node -e '
            const s = require("./qa-report/summary.json");
            const lines = [`### ${s.environment}: ${s.status} — ${s.passed} passed, ${s.failed} failed, ${s.flaky} flaky, ${s.skipped} skipped (${s.total} tests)`];
            for (const t of s.failedTests) lines.push(`- ❌ ${t.title}${t.file ? ` (${t.file})` : ""}: ${t.error}`);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '

      - name: Upload to Profihost
        if: always() && steps.ready.outputs.ok == 'true' && needs.plan.outputs.upload == 'true'
        continue-on-error: true
        env:
          PROFIHOST_HOST: ${{ secrets.PROFIHOST_HOST }}
          PROFIHOST_USER: ${{ secrets.PROFIHOST_USER }}
          PROFIHOST_SSH_KEY: ${{ secrets.PROFIHOST_SSH_KEY }}
          PROFIHOST_KNOWN_HOSTS: ${{ secrets.PROFIHOST_KNOWN_HOSTS }}
          PROFIHOST_PORT: ${{ secrets.PROFIHOST_PORT }}
        run: |
          # the Playwright image has no SSH client
          if [ -n "$PROFIHOST_HOST" ] && ! command -v sftp >/dev/null 2>&1; then
            apt-get update -qq >/dev/null && apt-get install -y -qq openssh-client >/dev/null
          fi
          bash ci/upload-profihost.sh qa-report/summary.json qa-report/results.json
