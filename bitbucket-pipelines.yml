# Bitbucket Pipelines — Shopware Playwright suite, one parallel step per shop
#
# Setup (once):
#   1. Repository settings → Deployments: create the environments  mallstreet, echonut, wurth
#      (type "Test"). mallstreet and wurth exist — the Echonut steps are commented out until its environment does.
#      Each environment's variables are that shop's .env values — same names:
#        BASE_URL, ALLOW_WRITE_TESTS, CLEANUP_TEST_DATA,
#        ADMIN_CLIENT_ID + ADMIN_CLIENT_SECRET (or ADMIN_USERNAME + ADMIN_PASSWORD),
#        HTTP_USERNAME + HTTP_PASSWORD, TEST_CUSTOMER_EMAIL + TEST_CUSTOMER_PASSWORD, SW_ACCESS_KEY
#      Mark passwords / secrets as "Secured". Optional: HEADED=true (bot protection that blocks headless browsers),
#      E2E_HEADER_VALUE (Secured) + E2E_HEADER_NAME (default x-e2e-bypass): secret header for a bot-protection
#      skip rule (e.g. Cloudflare WAF) — sent to the shop's own host only.
#      PROJECT is taken from the environment name.
#   2. Pipelines → Schedules → New schedule → branch main, pipeline "custom: nightly-all-shops", daily.
#
# Each step runs ci/e2e.sh. Reports: open a step → Artifacts (playwright-report/index.html) and the Tests tab (JUnit).

# Keep the tag in sync with @playwright/test in package.json
image: mcr.microsoft.com/playwright:v1.63.0-noble

definitions:
  steps:
    - step: &full
        name: Full suite
        size: 2x
        max-time: 120
        caches: [node]
        script:
          - bash ci/e2e.sh full
        artifacts:
          - playwright-report/**
          - test-results/**
    - step: &smoke
        name: Smoke
        size: 2x
        max-time: 30
        caches: [node]
        script:
          - bash ci/e2e.sh smoke
        artifacts:
          - playwright-report/**
          - test-results/**

pipelines:
  # every pull request → smoke tests on every shop
  pull-requests:
    '**':
      - parallel:
          - step: { <<: *smoke, name: Smoke – Mall Street, deployment: mallstreet }
          - step: { <<: *smoke, name: Smoke – Würth, deployment: wurth }
          # once its deployment environment exists:
          # - step: { <<: *smoke, name: Smoke – Echonut, deployment: echonut }

  # every push to main → smoke tests on every shop
  branches:
    main:
      - parallel:
          - step: { <<: *smoke, name: Smoke – Mall Street, deployment: mallstreet }
          - step: { <<: *smoke, name: Smoke – Würth, deployment: wurth }
          # once its deployment environment exists:
          # - step: { <<: *smoke, name: Smoke – Echonut, deployment: echonut }

  custom:
    # scheduled every night (Pipelines → Schedules) or started by hand ("Run pipeline")
    nightly-all-shops:
      - variables:
          - name: TEST_GREP
            default: ''
            description: 'Empty = all tests. Otherwise only tests matching, e.g. @checkout'
      - parallel:
          - step: { <<: *full, name: All tests – Mall Street, deployment: mallstreet }
          - step: { <<: *full, name: All tests – Würth, deployment: wurth }
          # once its deployment environment exists:
          # - step: { <<: *full, name: All tests – Echonut, deployment: echonut }

    # one shop at a time, by hand
    mallstreet:
      - step: { <<: *full, name: All tests – Mall Street, deployment: mallstreet }
    # echonut:
    #   - step: { <<: *full, name: All tests – Echonut, deployment: echonut }
    wurth:
      - step: { <<: *full, name: All tests – Würth, deployment: wurth }
